name: Daily activity log

on:
  schedule:
    # 01:17 UTC, roughly 08:17 WIB
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append today's entry
        run: |
          topics=("cyber security" "digital forensics" "web development" "mobile development" "systems study")
          day=$(( $(date -u +%j) % ${#topics[@]} ))
          stamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "- $stamp · ${topics[$day]} · status: online" >> activity.log
          tail -n 365 activity.log > activity.tmp
          mv activity.tmp activity.log

      - name: Commit and push
        run: |
          git config user.name "FeizenF"
          git config user.email "FeizenF@users.noreply.github.com"
          git add activity.log
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(activity): $(date -u +'%Y-%m-%d')"
          git push
