name: Daily activity log

on:
  schedule:
    # 01:17 UTC (08:17 WIB) and 09:17 UTC (16:17 WIB). The second run is a
    # retry: it only touches files when the first run missed the day.
    - cron: '17 1 * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write today's entry
        run: python3 .github/scripts/activity.py

      - name: Commit and push
        run: |
          git config user.name "FeizenF"
          git config user.email "FeizenF@users.noreply.github.com"
          git add activity.log README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(activity): $(date -u +'%Y-%m-%d')"
          git push
